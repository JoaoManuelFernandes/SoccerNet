_target_: sn_gamestate.jersey.tracklets_ocr.TrackletsOCR
batch_size: 32
model_dir: ${model_dir}
ocr_decision_strategy: confidence_sum  # or 'confidence_sum'
min_votes : 2  # minimum number of votes required to accept a jersey number
confidence_threshold : 0.9  # minimum confidence threshold for jersey number detection
jnr_batch_frames : 5
use_superres : True  # use super resolution to enhance jersey number detection
debug_paddleocr : False
ocr_only_model: null #null para usar os modelos todos em paralelo, ou ppocr_v4 para usar esse modelo apenas
# Escolha o modo de pose para benchmark e baseline:
# pose_mode: yolox_hrnet   # Pipeline antigo: YOLOX + HRNet
# pose_mode: rtmpose       # Pipeline novo: RTMPose-T
# pose_mode: mobilenetv2   # Pipeline novo: MobileNetV2
# pose_mode: litehrnet     # Pipeline novo: LiteHRNet-18
pose_mode: mobilenetv2  # Defina aqui o modo desejado

# Parâmetros dos modelos (usados conforme o modo)
pose_model_name: rtmpose-t_8xb256-420e_coco-256x192
pose_model_name_mobilenetv2: td-hm_mobilenetv2_8xb64-210e_coco-256x192
pose_model_name_litehrnet: td-hm_litehrnet-18_8xb64-210e_coco-256x192
pose2d: human  # Usado apenas no modo yolox_hrnet
pose_det_model: yolox_l_8x8_300e_coco  # Usado apenas no modo yolox_hrnet

# Exemplos de modelos rápidos para teste:
# pose_model_name: td-hm_litehrnet-18_8xb64-210e_coco-256x192  # Muito rápido, leve
# pose_model_name: td-hm_mobilenetv2_8xb64-210e_coco-256x192  # Extremamente rápido, menor precisão
# pose_model_name: rtmpose-t_8xb256-420e_coco-256x192         # RTMPose Tiny, rápido
# pose_model_name: td-hm_hrnet-w18_8xb64-210e_coco-256x192    # HRNet-W18, rápido
#yolox_l_8x8_300e_coco 
# Dica: Para listar modelos válidos, use:
# from mmengine.registry import init_default_scope; init_default_scope('mmpose'); from mmpose.apis import MMPoseInferencer; print(MMPoseInferencer.list_models(scope='mmpose'))

min_percent_away: 70.0  # Reduzido para aceitar tracklets parcialmente de costas
# Thresholds para lógica de costas (is_facing_away):
#   - angle_threshold_1: acima deste ângulo (em graus), exige score < score_threshold_1 em pelo menos 2 dos 3 (olhos/nariz)
#   - angle_threshold_2: entre angle_threshold_2 e angle_threshold_1, exige score < score_threshold_2 em pelo menos 2 dos 3
#   - angle_threshold_3: entre angle_threshold_3 e angle_threshold_2, exige score < score_threshold_2 em pelo menos 1 dos 3
#   - score_threshold_1: score máximo para olhos/nariz no caso de ângulo muito alto (costas evidentes)
#   - score_threshold_2: score máximo para olhos/nariz nos casos intermediários
angle_threshold_1: 175   # Acima deste ângulo, exige 2 scores < score_threshold_1
angle_threshold_2: 150   # Entre este e o anterior, exige 2 scores < score_threshold_2
angle_threshold_3: 145   # Entre este e o anterior, exige 1 score < score_threshold_2
score_threshold_1: 0.7   # Score máximo para olhos/nariz (costas evidentes)
score_threshold_2: 0.8   # Score máximo para olhos/nariz (casos intermediários)
angle_trunk_motion_threshold: 80   # Ângulo mínimo entre tronco e movimento para considerar "de costas" (heurística combinada)

# Heurística baseada em orientação do tronco vs direção do movimento:
# Para cada tracklet, será gravado um CSV com:
#   - frame_id, track_id, orientação_tronco, direção_movimento, ângulo_entre, is_facing_away, ...
# Isso permite análise visual posterior e ajuste fino dos thresholds.

jersey_segmentation_mode: densepose  # Opções: heuristic, sam, densepose, maskrcnn