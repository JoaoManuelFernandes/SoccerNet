# TrackLab SoccerNet config — FULL PIPELINE on 39 remaining test videos
# (complementa o sn-gamestate-test-10vid.pklz já existente)
# Cobre: SNGS-118..126, 129, 132..142, 145..150, 187..189, 192..200

defaults:
  - dataset: soccernet_gs
  - eval: gs_hota
  - engine: offline
  - state: save
  - visualization: gamestate
  - modules/bbox_detector: yolov8
  - modules/reid: prtreid
  - modules/track: bpbreid_strong_sort
  - modules/jersey_number_detect: tracklets_jnr_v2
  - modules/team: kmeans_embeddings
  - modules/team_side: mean_position
  - modules/tracklet_agg: voting_role_jn
  - modules/pitch : nbjw_calib
  - modules/calibration: nbjw_calib
  - _self_

# Pipeline completo (sem load_file — processa do zero)
pipeline:
  - bbox_detector
  - reid
  - track
  - pitch
  - calibration
  - jersey_number_detect
  - tracklet_agg
  - team
  - team_side

# Experiment name
experiment_name: "sn-gamestate"

# Path definitions
home_dir: "${oc.env:HOME}"
data_dir: "/home/joao/soccernet/data"
model_dir: "/home/joao/soccernet/pretrained_models"

# Machine configuration
hydra_env:
  PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
num_cores: 2
use_wandb: False
use_rich: True

modules:
  bbox_detector: {batch_size: 1}
  pose_bottomup: {batch_size: 1}
  reid: {batch_size: 1}
  track: {batch_size: 1}
  pitch: {batch_size: 1}
  calibration: {batch_size: 1}
  jersey_number_detect: {batch_size: 4}

# Flags
test_tracking: True
eval_tracking: False
print_config: False

# 39 vídeos test ainda não processados
dataset:
  nvid: 39
  nframes: -1
  eval_set: "test"
  dataset_path: ${data_dir}/SoccerNetGS
  vids_dict:
    test:
      - 'SNGS-118'
      - 'SNGS-119'
      - 'SNGS-120'
      - 'SNGS-121'
      - 'SNGS-122'
      - 'SNGS-123'
      - 'SNGS-124'
      - 'SNGS-125'
      - 'SNGS-126'
      - 'SNGS-129'
      - 'SNGS-132'
      - 'SNGS-133'
      - 'SNGS-134'
      - 'SNGS-135'
      - 'SNGS-136'
      - 'SNGS-137'
      - 'SNGS-138'
      - 'SNGS-139'
      - 'SNGS-140'
      - 'SNGS-141'
      - 'SNGS-142'
      - 'SNGS-145'
      - 'SNGS-146'
      - 'SNGS-147'
      - 'SNGS-148'
      - 'SNGS-149'
      - 'SNGS-150'
      - 'SNGS-187'
      - 'SNGS-188'
      - 'SNGS-189'
      - 'SNGS-192'
      - 'SNGS-193'
      - 'SNGS-194'
      - 'SNGS-195'
      - 'SNGS-196'
      - 'SNGS-197'
      - 'SNGS-198'
      - 'SNGS-199'
      - 'SNGS-200'

# Sem load_file — processa do zero
state:
  save_file: states/sn-gamestate-test-39vid.pklz

# Visualization
visualization:
  cfg:
    save_videos: False  # desactivado para ser mais rápido

project_dir: "${hydra:runtime.cwd}"
hydra:
  output_subdir: "configs"
  job:
    chdir: True
  run:
    dir: "outputs/${experiment_name}/${now:%Y-%m-%d}/${now:%H-%M-%S}"
  sweep:
    dir: "multirun_outputs/${experiment_name}/${now:%Y-%m-%d}/${now:%H-%M-%S}"
